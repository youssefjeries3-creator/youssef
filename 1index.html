<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي للتصوير الاحترافي</title>
    <style>
        /* تنسيق أساسي لضمان العمل على كل المتصفحات */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
        }
        
        /* شريط علوي بسيط */
        .top-bar {
            background-color: #000000;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            border-bottom: 3px solid #ffcc00;
        }

        /* عنوان الموقع الرئيسي */
        .hero-section {
            padding: 60px 20px;
            background-color: #262626;
        }
        .hero-section h1 {
            margin: 0 0 10px 0;
            font-size: 36px;
        }
        .hero-section p {
            color: #cccccc;
            font-size: 18px;
            margin: 0;
        }

        /* معرض الصور بنظام مرن ومضمون */
        .gallery-container {
            padding: 40px 10px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .photo-box {
            display: inline-block;
            width: 300px;
            margin: 15px;
            background-color: #333333;
            border: 2px solid #444444;
            border-radius: 8px;
            overflow: hidden;
            vertical-align: top;
        }
        .photo-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        .photo-desc {
            padding: 10px;
            font-size: 16px;
            color: #ffcc00;
        }

        /* أسفل الصفحة */
        .footer-bar {
            background-color: #000000;
            padding: 30px;
            margin-top: 40px;
            font-size: 14px;
            color: #888888;
        }
        .btn-call {
            display: inline-block;
            background-color: #ffcc00;
            color: #000000;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        📸 استوديو التصوير الإبداعي
    </div>

    <!-- قسم الترحيب الرئيسي -->
    <div class="hero-section">
        <h1>توثيق أجمل لحظات العمر</h1>
        <p>نقدم لكم خدمات تصوير فوتوغرافي وفيديو بجودة استثنائية</p>
    </div>

    <!-- معرض الصور المضمون -->
    <div class="gallery-container">
        
        <!-- الصورة الأولى -->
        <div class="photo-box">
            <img src="https://unsplash.com" alt="تصوير مناسبات">
            <div class="photo-desc">تصوير المناسبات والاحتفالات</div>
        </div>

        <!-- الصورة الثانية -->
        <div class="photo-box">
            <img src="https://unsplash.com" alt="تصوير طبيعة">
            <div class="photo-desc">تصوير الطبيعة والمناظر الخارجية</div>
        </div>

        <!-- الصورة الثالثة -->
        <div class="photo-box">
            <img src="https://unsplash.com" alt="جلسات تصوير">
            <div class="photo-desc">جلسات تصوير شخصية (سيشن)</div>
        </div>

    </div>

    <!-- أسفل الصفحة والتواصل -->
    <div class="footer-bar">
        <a href="mailto:test@example.com" class="btn-call">اضغط هنا لإرسال إيميل وحجز موعد</a>
        <p>© 2026 جميع الحقوق محفوظة للاستوديو الخاص بك.</p>
    </div>

</body>
</html>
